[package]
name = "task-manager"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] } # For serializing tasks
serde_json = "1.0" # For JSON storage
clap = { version = "4.0", features = ["derive"] } # CLI argument parsing
uuid = { version = "1.4", features = ["v4","serde"] } # Unique task IDs
